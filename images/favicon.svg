<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CR</title>
  <defs>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- Fondo azul oscuro de la marca -->
  <rect width="64" height="64" rx="12" fill="#15283A"/>

  <!-- Borde marrón retro aventurero -->
  <rect x="2" y="2" width="60" height="60" rx="10.5" fill="none" stroke="#A87950" stroke-width="3"/>

  <!-- Brillo neón (copia difuminada de las letras) -->
  <g transform="translate(1.5 0)" fill="none" stroke="#65B9F2" stroke-width="5.5"
     stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" opacity="0.8">
    <path d="M31.8 22 A14 14 0 1 0 31.8 42"/>
    <path d="M38 18 V46 M38 18 H47 A7.5 7.5 0 0 1 47 33 H38 M44 33 L53 46"/>
  </g>

  <!-- Letras CR nítidas -->
  <g transform="translate(1.5 0)" fill="none" stroke="#9fd8ff" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M31.8 22 A14 14 0 1 0 31.8 42"/>
    <path d="M38 18 V46 M38 18 H47 A7.5 7.5 0 0 1 47 33 H38 M44 33 L53 46"/>
  </g>
</svg>
